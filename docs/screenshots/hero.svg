<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EOH Arena protocol overview</title>
  <desc id="desc">A truthful reference diagram: a Merkle-authorized ranked job is checked by a work verifier, while market revenue remains outside ranked profit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172b"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06101f" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="170" fill="#4fd1c5" opacity=".12"/>
  <circle cx="160" cy="590" r="220" fill="#818cf8" opacity=".12"/>
  <text x="72" y="92" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700">EOH Arena</text>
  <text x="74" y="132" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="22">Objective work. Observable economics. Open versions.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="300" height="190" rx="20" fill="#17243d" stroke="#4fd1c5" stroke-width="2"/>
    <text x="100" y="252" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RANKED SCHEDULE</text>
    <text x="100" y="298" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Merkle root</text>
    <text x="100" y="335" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">spec • verifier • reward</text>
    <text x="100" y="365" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">one authorization per job</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="450" y="205" width="300" height="190" rx="20" fill="#17243d" stroke="#818cf8" stroke-width="2"/>
    <text x="480" y="252" fill="#a5b4fc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">VERIFIED SETTLEMENT</text>
    <text x="480" y="298" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">result + cost</text>
    <text x="480" y="335" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">proof replay protection</text>
    <text x="480" y="365" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">atomic reward accounting</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="830" y="205" width="300" height="190" rx="20" fill="#17243d" stroke="#fbbf24" stroke-width="2"/>
    <text x="860" y="252" fill="#fcd34d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">SELECTION</text>
    <text x="860" y="298" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">profit per epoch</text>
    <text x="860" y="335" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">market revenue stays separate</text>
    <text x="860" y="365" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">stale capital → commons</text>
  </g>
  <path d="M370 300h80M750 300h80" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/>
  <path d="m435 286 16 14-16 14M815 286l16 14-16 14" fill="none" stroke="#dbeafe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="500" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Reference implementation — not audited or deployment proof</text>
  <text x="72" y="540" fill="#b8c7df" font-family="Inter,Arial,sans-serif" font-size="18">Demo verifiers are test-only; runtime and external usefulness remain trust boundaries.</text>
</svg>
